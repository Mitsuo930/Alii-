<!DOCTYPE html>
<html>
<head>
  <title>💖 Will You Be My Valentine? 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      margin: 0; 
      background: url('bg.jpg') no-repeat center/cover; 
      font-family: sans-serif; 
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    #question { 
      text-align: center; 
      margin: 50px 20px 20px 20px; 
      font-size: 5vw; 
      color: white; 
      line-height: 1.2;
      z-index: 2;
    }
    .btn { 
      font-size: 5vw; 
      padding: 12px 25px; 
      margin: 15px; 
      cursor: pointer; 
      border-radius: 10px;
      border: none;
      background-color: rgba(255, 255, 255, 0.8);
      transition: transform 0.2s;
      z-index: 2;
    }
    .btn:active { transform: scale(0.95); }

    #hearts { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
      overflow: hidden;
      z-index: 1;
    }
    .heart { 
      position: absolute; 
      font-size: 5vw; 
      animation: floatUp 3s linear forwards; 
    }
    @keyframes floatUp { 
      0% { transform: translateY(0); opacity: 1; } 
      100% { transform: translateY(-120vh); opacity: 0; } 
    }

    /* Fullscreen video style */
    #videoPlayer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 3;
      background: black;
    }
  </style>
</head>
<body>
  <div id="hearts"></div>

  <div id="question">💘 Will you be my Valentine? 💘</div>

  <div style="text-align:center;">
    <button class="btn" onclick="playVideo('me.mp4')">Yes 💕</button>
    <button class="btn" onclick="playVideo('aray mo.mp4')">No 😢</button>
  </div>

  <video id="videoPlayer" controls></video>

  <script>
    function playVideo(file) {
      const video = document.getElementById('videoPlayer');
      video.src = file;
      video.style.display = 'block';
      video.muted = true;       // start muted for autoplay
      video.autoplay = true;

      // Play video and unmute
      video.play().then(() => {
        video.muted = false;
      }).catch(err => console.log('Autoplay blocked:', err));

      // Hide the question and buttons
      document.getElementById('question').style.display = 'none';
      document.querySelectorAll('.btn').forEach(btn => btn.style.display = 'none');

      // Scroll to video (optional)
      video.scrollIntoView({ behavior: 'smooth' });
    }

    // Heart animation
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.fontSize = (4 + Math.random() * 6) + 'vw';
      heart.textContent = '❤️';
      document.getElementById('hearts').appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }, 400);
  </script>
</body>
</html>
